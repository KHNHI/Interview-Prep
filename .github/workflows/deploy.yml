name: Deploy

# Deploys on every push to main (after CI passes), or manually.
# Skips deploy when a commit only touches docs/terraform/markdown (no app change).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
  workflow_dispatch:

# Required for OIDC federation with AWS (no long-lived access keys).
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2          # <-- your region
  ECR_REPOSITORY: interviewprep-api
  VITE_API_URL: https://api.lazyndev.io.vn

jobs:
  # ── 1. Build the API image and push it to ECR ──────────────────────────────
  build-push-api:
    name: Build & push API image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -f InterviewPlatform.API/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ── 2. Tell the EC2 box to pull the new image and restart (via SSM) ─────────
  # Uses AWS Systems Manager Run Command instead of SSH, so port 22 stays closed.
  deploy-api:
    name: Deploy API to EC2
    runs-on: ubuntu-latest
    needs: build-push-api
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail

          # Commands that run ON the EC2 box (as root, via the SSM agent).
          # \$ defers expansion to the remote shell; ${AWS_REGION} expands here.
          PARAMS=$(cat <<JSON
          {"commands":[
            "set -e",
            "cd /opt/interviewprep",
            "REGISTRY=\$(grep ECR_IMAGE .env | cut -d= -f2 | cut -d/ -f1)",
            "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin \$REGISTRY",
            "docker compose -f docker-compose.prod.yml pull",
            "docker compose -f docker-compose.prod.yml up -d",
            "docker image prune -f"
          ]}
          JSON
          )

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy interviewprep-api ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "Sent SSM command: $CMD_ID"

          # Poll until the command reaches a terminal state.
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            echo "  status: $STATUS ... waiting"
            sleep 5
          done

          echo "===== remote stdout ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== remote stderr ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]

  # ── 3. Build the frontend and publish to S3 + CloudFront ───────────────────
  deploy-web:
    name: Deploy frontend to S3/CloudFront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interview-platform-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interview-platform-web/package-lock.json

      - name: Install & build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist "s3://${{ secrets.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
