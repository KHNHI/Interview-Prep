name: Deploy

# Deploys on every push to main (after CI passes), or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC federation with AWS (no long-lived access keys).
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2          # <-- your region
  ECR_REPOSITORY: interviewprep-api
  VITE_API_URL: https://api.lazyndev.io.vn

jobs:
  # ── 1. Build the API image and push it to ECR ──────────────────────────────
  build-push-api:
    name: Build & push API image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -f InterviewPlatform.API/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ── 2. Tell the EC2 box to pull the new image and restart ──────────────────
  deploy-api:
    name: Deploy API to EC2
    runs-on: ubuntu-latest
    needs: build-push-api
    steps:
      - name: Restart stack over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION
          script: |
            set -e
            cd /opt/interviewprep
            REGISTRY=$(grep ECR_IMAGE .env | cut -d= -f2 | cut -d/ -f1)
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

  # ── 3. Build the frontend and publish to S3 + CloudFront ───────────────────
  deploy-web:
    name: Deploy frontend to S3/CloudFront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interview-platform-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interview-platform-web/package-lock.json

      - name: Install & build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist "s3://${{ secrets.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
