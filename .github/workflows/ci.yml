name: CI

# Build and test on every PR and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore InterviewPlatform.sln

      - name: Build
        run: dotnet build InterviewPlatform.sln -c Release --no-restore

      # Unit tests only. Integration tests use Testcontainers (Docker) — wire them
      # in here once they're written: `dotnet test InterviewPlatform.Tests.Integration/...`
      - name: Unit tests
        run: dotnet test InterviewPlatform.Tests.Unit/InterviewPlatform.Tests.Unit.csproj -c Release --no-build --verbosity normal

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interview-platform-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interview-platform-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (runs tsc -b && vite build)
        run: npm run build
